name: Build and Publish APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare debug signing keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Stage APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk NoomiAI-v1.0.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Noomi AI v1.0
          body: |
            Latest build of **Noomi AI** (`com.aistudio.noomiai.krmvqt`, v1.0 / Build 1).
            Download `NoomiAI-v1.0.apk` below to install on Android 7.0+ (API 24+).
          files: NoomiAI-v1.0.apk
          prerelease: false
          make_latest: true
