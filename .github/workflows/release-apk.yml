name: Build and Publish APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Prepare debug signing keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Verify and stage NoomiAI-v1.0.apk
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk NoomiAI-v1.0.apk
          ls -lh NoomiAI-v1.0.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoomiAI-v1.0-apk
          path: NoomiAI-v1.0.apk

      - name: Point v1.0 release tag to current commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f v1.0
          git push origin refs/tags/v1.0 --force

      - name: Publish direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Noomi AI v1.0
          body: |
            Latest build of **Noomi AI** (`com.aistudio.noomiai.krmvqt`, v1.0 / Build 1).

            [Download NoomiAI-v1.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.0/NoomiAI-v1.0.apk)
          files: NoomiAI-v1.0.apk
          draft: false
          prerelease: false
          make_latest: 'true'
          overwrite_files: true
          fail_on_unmatched_files: true
